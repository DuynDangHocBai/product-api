name: Test Product CI (Production)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: mduyn/product-api

jobs:
  integration-test:
    name: CRUD integration test with MongoDB
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_MONGO_URI: mongodb://localhost:27017/productdb_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit + CRUD integration tests
        run: npm test

  e2e-docker:
    name: E2E test on Docker Compose (production-like)
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create .env from template
        run: cp .env.example .env

      - name: Build and start stack (wait until healthy)
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Show container health
        run: docker compose ps

      - name: Run E2E CRUD tests
        run: bash scripts/e2e-test.sh http://localhost:3000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  cd-dockerhub:
    name: CD - Push image to Docker Hub
    runs-on: ubuntu-latest
    needs: [integration-test, e2e-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image is healthy
        run: |
          docker network create verify-net
          docker run -d --name mongo --network verify-net mongo:7
          docker run -d --name api --network verify-net -p 3000:3000 \
            -e MONGO_URI=mongodb://mongo:27017/productdb \
            ${{ env.IMAGE_NAME }}:latest
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
            sleep 3
          done
          if [ "$STATUS" != "healthy" ]; then docker logs api; exit 1; fi
          bash scripts/e2e-test.sh http://localhost:3000
