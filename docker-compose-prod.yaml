name: product-api-prod

services:
  mongodb:
    image: mongo:7
    container_name: nammongodb-prod
    restart: unless-stopped
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-api:
    image: mduyn/product-api:${IMAGE_TAG:-latest}
    container_name: product-api-prod
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-prod-data:
    name: nammongodb-prod-data
