services:
  mongodb:
    image: mongo:7
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-api:
    build: .
    image: product-api:1.0
    container_name: product-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/productdb
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo-data:
    name: nammongodb-data
