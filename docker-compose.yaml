services:
  mongodb:
    image: mongo:7
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  product-api:
    build: .
    image: product-api:1.0
    container_name: product-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/productdb
    ports:
      - "3000:3000"
    depends_on:
      - mongodb

volumes:
  mongo-data:
    name: nammongodb-data
